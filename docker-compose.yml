version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    command: streamlit run app/ui/main.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api 